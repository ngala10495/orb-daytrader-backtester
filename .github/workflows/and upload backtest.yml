name: ORB Backtest
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python3 orb_backtester.py
      - uses: actions/upload-artifact@v4
        with:
          name: orb-trade-log
          path: orb_trade_log.csv
